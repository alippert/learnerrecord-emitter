# Publish @learnerrecord/emitter to npm: public, under the `next` dist-tag while LPAI's contract is 0.x,
# with provenance, on a tag named v<version>. Uses npm trusted publishing (OIDC: no token stored) once
# the package's trusted publisher names this repository and this file; until then (npm needs the
# package to exist first) the NPM_TOKEN repository secret is the fallback.
name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write   # trusted publishing and provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm, registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      - name: the tag names the package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: publish
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: npm install -g npm@latest && npm publish --provenance --access public --tag next
